<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise AI Agent Demo</title>
    <!-- Tailwind CSS for rapid styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Vue 3 for reactive state management -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col items-center justify-center p-4">

    <div id="app" class="w-full max-w-3xl bg-white shadow-xl rounded-lg overflow-hidden flex flex-col h-[80vh]">
        <!-- Header -->
        <div class="bg-slate-800 text-white p-4 shadow-md flex justify-between items-center">
            <h1 class="text-xl font-bold">Enterprise AI Agent</h1>
            <span class="text-xs bg-slate-700 px-2 py-1 rounded">Session: {{ threadId }}</span>
        </div>

        <!-- Chat History -->
        <div class="flex-1 p-4 overflow-y-auto bg-slate-50" id="chat-box">
            <div v-for="(msg, index) in messages" :key="index" 
                 :class="msg.role === 'user' ? 'text-right' : 'text-left'" class="mb-4">
                <div :class="msg.role === 'user' ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-800'"
                     class="inline-block px-4 py-2 rounded-lg max-w-[80%] shadow-sm">
                    <p class="whitespace-pre-wrap text-sm">{{ msg.content }}</p>
                </div>
            </div>
            
            <!-- Loading Indicator -->
            <div v-if="isLoading" class="text-left mb-4">
                <div class="inline-block px-4 py-2 rounded-lg bg-gray-100 text-gray-500 animate-pulse text-sm">
                    Agent is thinking...
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-4 bg-white border-t border-gray-200">
            <form @submit.prevent="sendMessage" class="flex gap-2">
                <input v-model="userInput" type="text" placeholder="Ask about corporate metrics or search the web..." 
                       class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                       :disabled="isLoading">
                <button type="submit" 
                        class="bg-blue-600 text-white px-6 py-2 rounded-lg font-medium hover:bg-blue-700 transition-colors disabled:bg-blue-300"
                        :disabled="isLoading || !userInput.trim()">
                    Send
                </button>
            </form>
        </div>
    </div>

    <script>
        const { createApp, ref, nextTick } = Vue;

        createApp({
            setup() {
                // Generate a random thread ID for this browser session
                const threadId = ref(Math.random().toString(36).substring(2, 10));
                const userInput = ref('');
                const messages = ref([
                    { role: 'agent', content: 'Hello! I am connected to the internal databases and SearXNG. How can I assist you today?' }
                ]);
                const isLoading = ref(false);

                const sendMessage = async () => {
                    if (!userInput.value.trim()) return;

                    const messageText = userInput.value;
                    messages.value.push({ role: 'user', content: messageText });
                    userInput.value = '';
                    isLoading.value = true;
                    
                    scrollToBottom();

                    try {
                        const response = await fetch('/chat', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                thread_id: threadId.value,
                                message: messageText
                            })
                        });

                        const data = await response.json();
                        
                        messages.value.push({ 
                            role: 'agent', 
                            content: data.response || "Error parsing response." 
                        });
                    } catch (error) {
                        messages.value.push({ role: 'agent', content: '⚠️ Connection to API failed.' });
                    } finally {
                        isLoading.value = false;
                        scrollToBottom();
                    }
                };

                const scrollToBottom = () => {
                    nextTick(() => {
                        const chatBox = document.getElementById('chat-box');
                        if (chatBox) chatBox.scrollTop = chatBox.scrollHeight;
                    });
                };

                return { threadId, userInput, messages, isLoading, sendMessage };
            }
        }).mount('#app');
    </script>
</body>
</html>
